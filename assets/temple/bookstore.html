      image: "https://static.wixstatic.com/media/d6c75e_ee34dbaadedc47e39aac392e317d3b56~mv2.jpg",
      description: "The art and science of potion-making, from tinctures to elixirs.",
      signedPrice: "$29.99",
      amazonPrice: "$9.99",
      amazonUrl: "https://www.amazon.com/dp/B0D12D4NZC",
      signedUrl: ""
    },
    {
      title: "The Magic Within Your Hands",
      author: "Sebastian & Lucius Nightwell",
      badge: "Curriculum",
      rune: "✋",
      image: "https://static.wixstatic.com/media/d6c75e_028fc221dfa4489b89c3d0bc3284dfbb~mv2.jpg",
      description: "A guide to crafting and consecrating your own magical tools.",
      signedPrice: "$24.99",
      amazonPrice: "$9.99",
      amazonUrl: "https://www.amazon.com/dp/B0CZNX5FS5",
      signedUrl: ""
    },
    {
      title: "Obsidian Veil University Enrollment Brochure",
      author: "Sebastian Nightwell",
      badge: "Curriculum",
      rune: "🎓",
      image: "https://static.wixstatic.com/media/d6c75e_b503bb5bf8c04da4950a24eced5672f8~mv2.jpg",
      description: "An introduction to the Temple's curriculum and course of study.",
      signedPrice: "N/A",
      amazonPrice: "$0.99",
      amazonUrl: "https://www.amazon.com/dp/B0CZJV3WBY",
      signedUrl: ""
    },

    // ---- Fiction ----
    {
      title: "Winter's Heart",
      author: "Sebastian Nightwell",
      badge: "Fiction",
      rune: "❄",
      image: "https://static.wixstatic.com/media/d6c75e_b850003ea0e64d22bae95dddb3c661f1~mv2.jpg",
      description: "A Snow Queen tale — two cursed immortals, a shattered mirror, and a bond that won't stay broken.",
      signedPrice: "$23.50",
      amazonPrice: "$9.99",
      amazonUrl: "https://www.amazon.com/dp/B0GB6VRZHR",
      signedUrl: ""
    },
    {
      title: "Heart of the Drakkyn",
      author: "Sebastian Nightwell & Thaddeus Johnson",
      badge: "Fiction",
      rune: "🐉",
      image: "https://static.wixstatic.com/media/d6c75e_dffc6cd63b4746638b16d69bf3def5cf~mv2.jpg",
      description: "Book one of the Drakkyn Saga — a dragon-blooded outcast crosses into a realm at war.",
      signedPrice: "$29.99",
      amazonPrice: "$9.99",
      amazonUrl: "https://www.amazon.com/dp/B0FWD1KZ2J",
      signedUrl: ""
    },

    // ---- Family & Children's ----
    {
      title: "Temple Time Adventures, Vol. 1",
      author: "Sebastian Nightwell",
      badge: "Family",
      rune: "⭐",
      image: "https://static.wixstatic.com/media/d6c75e_030bb8b7110b47cf8432891fe7c0803c~mv2.jpg",
      description: "Where Faith and Fun Collide — a family-friendly title from the Temple.",
      signedPrice: "$39.99",
      amazonPrice: "$9.99",
      amazonUrl: "https://www.amazon.com/Temple-Time-Adventures-Where-Collide/dp/B0CXF5K73S",
      signedUrl: ""
    }
  ];

  /* =========================================================
     ⚙️ WIDGET ENGINE
  ========================================================= */
  const emailjsConfigured =
    EMAILJS_PUBLIC_KEY !== "YOUR_PUBLIC_KEY" &&
    EMAILJS_SERVICE_ID !== "YOUR_SERVICE_ID" &&
    EMAILJS_TEMPLATE_ID !== "YOUR_TEMPLATE_ID";

  if (emailjsConfigured && window.emailjs) {
    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
  }

  function formatPrice(val) {
    if (!val || val === "N/A") return "N/A";
    val = val.trim();
    return (val.startsWith("$") || val.startsWith("↗")) ? val : "$" + val;
  }

  function buildSignedMailto(book, formData) {
    if (!SIGNED_ORDER_EMAIL) return "";
    const subject = encodeURIComponent("Signed Copy Request: " + book.title);
    const name = (formData && formData.name) || "";
    const email = (formData && formData.email) || "";
    const address = (formData && formData.address) || "";
    const body = encodeURIComponent(
      "Hello! I'd like to order a signed copy of \"" + book.title + "\".\n\n" +
      "Name: " + name + "\n" +
      "Email: " + email + "\n" +
      "Shipping Address: " + address + "\n\n" +
      "Thank you!"
    );
    return "mailto:" + SIGNED_ORDER_EMAIL + "?subject=" + subject + "&body=" + body;
  }

  const root = document.getElementById("grimoire-root");

  // Render Header
  const header = document.createElement("div");
  header.className = "grimoire-header";
  header.innerHTML =
    '<p class="grimoire-eyebrow">Obsidian Moon Temple</p>' +
    '<h2 class="grimoire-title">' + TEMPLE_TITLE + '</h2>' +
    '<p class="grimoire-sub">' + TEMPLE_SUB + '</p>' +
    '<div class="grimoire-divider"></div>' +
    '<button type="button" class="btn-submit-tome" id="btn-open-submit">✦ Submit Your Tome ✦</button>';
  root.appendChild(header);

  // Render Shelf Grid
  const shelf = document.createElement("div");
  shelf.className = "grimoire-shelf";

  LIBRARY.forEach(function (book, index) {
    const card = document.createElement("div");
    card.className = "tome";

    const sPrice = formatPrice(book.signedPrice);
    const aPrice = formatPrice(book.amazonPrice);

    const coverHtml = book.image
      ? '<div class="tome-cover"><img src="' + book.image + '" alt="' + book.title + ' cover"></div>'
      : '<div class="tome-cover no-image"><span class="tome-rune">' + (book.rune || "✦") + '</span></div>';

    const hasSignedOption = sPrice !== "N/A" && (!!SIGNED_ORDER_EMAIL || !!book.signedUrl);
    const signedBtn = hasSignedOption
      ? '<button type="button" class="tome-btn btn-signed" data-index="' + index + '">' +
          '<span>Buy Signed Copy</span><span class="btn-price">' + sPrice + '</span></button>'
      : '';

    const amazonBtn = book.amazonUrl
      ? '<a class="tome-btn btn-amazon" href="' + book.amazonUrl + '" target="_blank" rel="noopener">' +
          '<span>Buy on Amazon</span><span class="btn-price">' + aPrice + '</span></a>'
      : '';

    const disclaimerHtml = signedBtn ? '<p class="tome-disclaimer">' + SIGNED_DISCLAIMER + '</p>' : '';

    card.innerHTML =
      coverHtml +
      (book.badge ? '<p class="tome-badge">' + book.badge + '</p>' : '') +
      '<h3 class="tome-title">' + book.title + '</h3>' +
      '<p class="tome-author">' + (book.author || "") + '</p>' +
      '<p class="tome-desc">' + (book.description || "") + '</p>' +
      '<div class="tome-actions">' + signedBtn + amazonBtn + '</div>' +
      disclaimerHtml;

    shelf.appendChild(card);
  });

  root.appendChild(shelf);

  // Render Footer
  const footer = document.createElement("div");
  footer.className = "grimoire-footer";
  footer.textContent = "✧ Every signed copy is blessed before it leaves our hands ✧";
  root.appendChild(footer);

  const pricingNote = document.createElement("p");
  pricingNote.className = "grimoire-pricing-note";
  pricingNote.textContent = "Amazon prices shown above are for the Kindle (digital) editions. Paperback copies are also available through the same Amazon link. Signed copies are priced $5 above the paperback price on Amazon.";
  root.appendChild(pricingNote);

  /* Helper to align modal dynamically within iframe height */
  function positionOverlayModal(overlay, triggerElement) {
    const triggerRect = triggerElement ? triggerElement.getBoundingClientRect() : { top: 100 };
    const currentScroll = window.pageYOffset || document.documentElement.scrollTop || 0;
    // Calculate position so modal lands directly in user's view
    const targetTop = Math.max(20, currentScroll + triggerRect.top - 50);
    
    overlay.style.paddingTop = targetTop + "px";
  }

  /* =========================================================
     MODAL 1: BUY SIGNED COPY
  ========================================================= */
  shelf.addEventListener("click", function (e) {
    const btn = e.target.closest(".btn-signed");
    if (!btn) return;

    const idx = btn.getAttribute("data-index");
    const book = LIBRARY[idx];
    if (!book) return;

    if (book.signedUrl) {
      window.open(book.signedUrl, "_blank", "noopener");
      return;
    }

    openOrderModal(book, btn);
  });

  function openOrderModal(book, triggerBtn) {
    const price = formatPrice(book.signedPrice);

    const overlay = document.createElement("div");
    overlay.className = "grimoire-overlay";
    positionOverlayModal(overlay, triggerBtn);

    const modal = document.createElement("div");
    modal.className = "grimoire-modal";
    modal.innerHTML =
      '<button type="button" class="grimoire-modal-close" aria-label="Close">✕</button>' +
      '<p class="grimoire-modal-eyebrow">Signed Copy Request</p>' +
      '<h3 class="grimoire-modal-title">' + book.title + '</h3>' +
      '<p class="grimoire-modal-price">' + price + '</p>' +
      '<div class="grimoire-field">' +
        '<label for="grimoire-name">Name</label>' +
        '<input type="text" id="grimoire-name" required>' +
      '</div>' +
      '<div class="grimoire-field">' +
        '<label for="grimoire-email">Email</label>' +
        '<input type="email" id="grimoire-email" required>' +
      '</div>' +
      '<div class="grimoire-field">' +
        '<label for="grimoire-address">Shipping Address</label>' +
        '<textarea id="grimoire-address" required></textarea>' +
      '</div>' +
      '<button type="button" class="tome-btn btn-signed grimoire-modal-submit">' +
        '<span>Send Order Request</span><span class="btn-price">→</span>' +
      '</button>' +
      '<p class="tome-disclaimer">' + SIGNED_DISCLAIMER + '</p>' +
      '<div class="grimoire-modal-status"></div>';

    overlay.appendChild(modal);
    root.appendChild(overlay);

    const closeBtn = modal.querySelector(".grimoire-modal-close");
    const submitBtn = modal.querySelector(".grimoire-modal-submit");
    const statusEl = modal.querySelector(".grimoire-modal-status");
    const nameEl = modal.querySelector("#grimoire-name");
    const emailEl = modal.querySelector("#grimoire-email");
    const addressEl = modal.querySelector("#grimoire-address");

    function closeModal() { overlay.remove(); }
    closeBtn.addEventListener("click", closeModal);
    overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });

    submitBtn.addEventListener("click", function () {
      const formData = {
        name: nameEl.value.trim(),
        email: emailEl.value.trim(),
        address: addressEl.value.trim()
      };

      if (!formData.name || !formData.email || !formData.address) {
        statusEl.textContent = "Please fill in all three fields.";
        statusEl.className = "grimoire-modal-status error";
        return;
      }

      submitBtn.setAttribute("disabled", "true");
      statusEl.textContent = "Sending your request...";
      statusEl.className = "grimoire-modal-status pending";

      if (emailjsConfigured && window.emailjs) {
        emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          book_title: book.title,
          price: price,
          buyer_name: formData.name,
          buyer_email: formData.email,
          shipping_address: formData.address,
          to_email: SIGNED_ORDER_EMAIL
        }).then(function () {
          statusEl.textContent = "✧ Request sent! We'll be in touch to confirm shipping and payment.";
          statusEl.className = "grimoire-modal-status success";
          submitBtn.style.display = "none";
          setTimeout(closeModal, 3500);
        }).catch(function () {
          statusEl.textContent = "Couldn't send automatically — opening your email app as a backup.";
          statusEl.className = "grimoire-modal-status error";
          window.open(buildSignedMailto(book, formData), "_blank");
          submitBtn.removeAttribute("disabled");
        });
      } else {
        statusEl.textContent = "Opening your email app to complete the request...";
        statusEl.className = "grimoire-modal-status pending";
        window.open(buildSignedMailto(book, formData), "_blank");
        submitBtn.removeAttribute("disabled");
      }
    });

    nameEl.focus();
  }

  /* =========================================================
     MODAL 2: MEMBER BOOK SUBMISSION FORM
  ========================================================= */
  document.getElementById("btn-open-submit").addEventListener("click", function (e) {
    openSubmissionModal(e.currentTarget);
  });

  function openSubmissionModal(triggerBtn) {
    const overlay = document.createElement("div");
    overlay.className = "grimoire-overlay";
    positionOverlayModal(overlay, triggerBtn);

    const modal = document.createElement("div");
    modal.className = "grimoire-modal";
    modal.innerHTML =
      '<button type="button" class="grimoire-modal-close" aria-label="Close">✕</button>' +
      '<p class="grimoire-modal-eyebrow">Member Submission</p>' +
      '<h3 class="grimoire-modal-title">Submit Your Tome</h3>' +
      '<p class="tome-disclaimer" style="margin-bottom: 16px;">Submit your work to be featured in the Grimoire Shelf. Entries are reviewed before publication.</p>' +
      
      '<div class="grimoire-field">' +
        '<label for="sub-title">Book Title</label>' +
        '<input type="text" id="sub-title" placeholder="e.g. Shadows of the Moon" required>' +
      '</div>' +
      '<div class="grimoire-field">' +
        '<label for="sub-author">Author Name(s)</label>' +
        '<input type="text" id="sub-author" placeholder="e.g. Jane Doe" required>' +
      '</div>' +
      '<div class="grimoire-field">' +
        '<label for="sub-badge">Category / Badge</label>' +
        '<select id="sub-badge">' +
          '<option value="Fiction">Fiction</option>' +
          '<option value="Ritual Texts">Ritual Texts</option>' +
          '<option value="Curriculum">Curriculum</option>' +
          '<option value="Family">Family</option>' +
        '</select>' +
      '</div>' +
      '<div class="grimoire-field">' +
        '<label for="sub-desc">Short Description</label>' +
        '<textarea id="sub-desc" placeholder="Brief summary of your tome..." required></textarea>' +
      '</div>' +
      '<div class="grimoire-field">' +
        '<label for="sub-cover">Cover Image Link (URL)</label>' +
        '<input type="url" id="sub-cover" placeholder="https://...">' +
      '</div>' +
      '<div class="grimoire-field">' +
        '<label for="sub-signed-price">Signed Copy Price</label>' +
        '<input type="text" id="sub-signed-price" placeholder="$29.99 or N/A">' +
      '</div>' +
      '<div class="grimoire-field">' +
        '<label for="sub-amazon-price">Amazon Digital/Paperback Price</label>' +
        '<input type="text" id="sub-amazon-price" placeholder="$9.99">' +
      '</div>' +
      '<div class="grimoire-field">' +
        '<label for="sub-amazon-url">Amazon Purchase URL</label>' +
        '<input type="url" id="sub-amazon-url" placeholder="https://www.amazon.com/dp/...">' +
      '</div>' +

      '<button type="button" class="tome-btn btn-signed grimoire-modal-submit">' +
        '<span>Submit Tome for Review</span><span class="btn-price">→</span>' +
      '</button>' +
      '<div class="grimoire-modal-status"></div>';

    overlay.appendChild(modal);
    root.appendChild(overlay);

    const closeBtn = modal.querySelector(".grimoire-modal-close");
    const submitBtn = modal.querySelector(".grimoire-modal-submit");
    const statusEl = modal.querySelector(".grimoire-modal-status");

    function closeModal() { overlay.remove(); }
    closeBtn.addEventListener("click", closeModal);
    overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });

    submitBtn.addEventListener("click", function () {
      const title = modal.querySelector("#sub-title").value.trim();
      const author = modal.querySelector("#sub-author").value.trim();
      const badge = modal.querySelector("#sub-badge").value;
      const desc = modal.querySelector("#sub-desc").value.trim();
      const cover = modal.querySelector("#sub-cover").value.trim();
      const signedPrice = modal.querySelector("#sub-signed-price").value.trim() || "$29.99";
      const amazonPrice = modal.querySelector("#sub-amazon-price").value.trim() || "$9.99";
      const amazonUrl = modal.querySelector("#sub-amazon-url").value.trim();

      if (!title || !author || !desc) {
        statusEl.textContent = "Please fill in at least Title, Author, and Description.";
        statusEl.className = "grimoire-modal-status error";
        return;
      }

      // Pre-formatted code snippet sent directly to your email
      const codeBlock = `{\n  title: "${title}",\n  author: "${author}",\n  badge: "${badge}",\n  rune: "✦",\n  image: "${cover}",\n  description: "${desc.replace(/"/g, '\\"')}",\n  signedPrice: "${signedPrice}",\n  amazonPrice: "${amazonPrice}",\n  amazonUrl: "${amazonUrl}",\n  signedUrl: ""\n},`;

      submitBtn.setAttribute("disabled", "true");
      statusEl.textContent = "Submitting your tome...";
      statusEl.className = "grimoire-modal-status pending";

      if (emailjsConfigured && window.emailjs) {
        emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          book_title: "NEW MEMBER SUBMISSION: " + title,
          price: "Signed: " + signedPrice + " | Amazon: " + amazonPrice,
          buyer_name: author,
          buyer_email: "Member Submission",
          shipping_address: "CODE BLOCK TO COPY:\n\n" + codeBlock,
          to_email: SIGNED_ORDER_EMAIL
        }).then(function () {
          statusEl.textContent = "✧ Submission received! We will review your tome shortly.";
          statusEl.className = "grimoire-modal-status success";
          submitBtn.style.display = "none";
          setTimeout(closeModal, 3500);
        }).catch(function () {
          statusEl.textContent = "Couldn't send automatically — opening email client.";
          statusEl.className = "grimoire-modal-status error";
          const mailto = "mailto:" + SIGNED_ORDER_EMAIL + "?subject=" + encodeURIComponent("Book Submission: " + title) + "&body=" + encodeURIComponent(codeBlock);
          window.open(mailto, "_blank");
          submitBtn.removeAttribute("disabled");
        });
      } else {
        const mailto = "mailto:" + SIGNED_ORDER_EMAIL + "?subject=" + encodeURIComponent("Book Submission: " + title) + "&body=" + encodeURIComponent(codeBlock);
        window.open(mailto, "_blank");
        submitBtn.removeAttribute("disabled");
      }
    });
  }

})();
</script>
