<!DOCTYPE html>
<!-- The Coven Cookbook: Thaddeus's own program from the old temple web pages (30 October 2026), played inside the Temple of the Obsidian Moon. Changes for the game are marked "temple:". -->
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>The Obsidian Moon Cookbook</title>
<style>html,body{margin:0;background:#120d1c;min-height:100%}</style></head><body>

<!--
  THE OBSIDIAN MOON COOKBOOK — live grimoire, connected to your Wix data
  ---------------------------------------------------------------------
  This version pulls real, approved recipes from your CookbookEntries
  collection through the backend endpoint you published. New approved
  entries show up automatically — no code changes needed for content.

  If the endpoint URL ever changes, update DATA_ENDPOINT near the top
  of the script below.
-->
<div id="cookbook-root"></div>

<style>
  #cookbook-root {
    --void: #120d1c;
    --twilight: #1f1730;
    --twilight-light: #2b2143;
    --parchment: #ece2c6;
    --parchment-dark: #dccfa4;
    --parchment-dim: #b9ae95;
    --ink: #2a2015;
    --ink-soft: #4a3d28;
    --gold: #c9a227;
    --gold-bright: #e6c65c;
    --amethyst: #8266c9;

    box-sizing: border-box;
    background: radial-gradient(ellipse at top, var(--twilight) 0%, var(--void) 65%);
    padding: 48px 20px 56px;
    border-radius: 4px;
    font-family: 'EB Garamond', Georgia, serif;
    color: var(--parchment);
    position: relative;
    min-height: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #cookbook-root *, #cookbook-root *::before, #cookbook-root *::after { box-sizing: border-box; }

  .cb-eyebrow {
    font-family: 'IM Fell English SC', 'EB Garamond', serif;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--gold);
    opacity: 0.85;
    margin: 0 0 28px;
    text-align: center;
  }

  .cb-stage {
    perspective: 2400px;
    width: 100%;
    max-width: 760px;
    display: flex;
    justify-content: center;
  }

  /* ---------- Cover ---------- */
  .cb-cover {
    width: 340px;
    height: 460px;
    background: linear-gradient(160deg, #241a35, #150f21);
    border: 2px solid rgba(201,162,39,0.5);
    border-radius: 6px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.55), inset 0 0 40px rgba(201,162,39,0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.6s ease, box-shadow 0.6s ease, opacity 0.6s ease;
    animation: cbCoverGlow 4.5s ease-in-out infinite;
  }
  .cb-cover:hover {
    transform: translateY(-4px);
    box-shadow: 0 36px 80px rgba(0,0,0,0.6), 0 0 46px rgba(230,198,92,0.35);
  }
  .cb-cover.cb-opening {
    transform: rotateY(-100deg) translateX(-40px);
    opacity: 0;
    pointer-events: none;
  }
  @keyframes cbCoverGlow {
    0%, 100% { box-shadow: 0 30px 70px rgba(0,0,0,0.55), inset 0 0 40px rgba(201,162,39,0.08), 0 0 0 rgba(230,198,92,0); }
    50% { box-shadow: 0 30px 70px rgba(0,0,0,0.55), inset 0 0 40px rgba(201,162,39,0.14), 0 0 34px rgba(230,198,92,0.22); }
  }
  .cb-cover::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 15% 20%, rgba(230,198,92,0.5), transparent),
      radial-gradient(1px 1px at 75% 30%, rgba(230,198,92,0.35), transparent),
      radial-gradient(1px 1px at 40% 75%, rgba(230,198,92,0.4), transparent),
      radial-gradient(1px 1px at 85% 80%, rgba(230,198,92,0.3), transparent);
    animation: cbTwinkle 3.2s ease-in-out infinite;
  }
  @keyframes cbTwinkle {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
  .cb-cover-logo {
    width: 96px;
    height: 96px;
    object-fit: contain;
    margin-bottom: 20px;
    filter: drop-shadow(0 0 10px rgba(230,198,92,0.35));
    animation: cbLogoGlow 4.5s ease-in-out infinite;
    position: relative;
  }
  @keyframes cbLogoGlow {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(230,198,92,0.3)); }
    50% { filter: drop-shadow(0 0 20px rgba(230,198,92,0.55)); }
  }
  .cb-cover-sigil {
    font-size: 54px;
    color: var(--gold-bright);
    text-shadow: 0 0 18px rgba(230,198,92,0.5);
    margin-bottom: 20px;
    position: relative;
    animation: cbLogoGlow 4.5s ease-in-out infinite;
  }
  .cb-cover-title {
    font-family: 'Cinzel Decorative', 'Cinzel', serif;
    font-weight: 700;
    font-size: 28px;
    margin: 0 0 12px;
    color: var(--parchment);
  }
  .cb-cover-sub {
    font-style: italic;
    color: var(--parchment-dim);
    font-size: 14px;
    margin: 0 0 26px;
    line-height: 1.5;
  }
  .cb-cover-prompt {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.85;
  }

  /* ---------- Open book ---------- */
  .cb-book {
    display: none;
    width: 100%;
    max-width: 760px;
    background: linear-gradient(160deg, #241a35, #150f21);
    border: 2px solid rgba(201,162,39,0.4);
    border-radius: 6px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.55);
    padding: 22px;
  }
  .cb-book.cb-visible { display: block; }

  .cb-spread {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--parchment);
    border-radius: 3px;
    min-height: 420px;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.15);
    overflow: hidden;
  }
  .cb-spread::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 30px;
    margin-left: -15px;
    background: linear-gradient(90deg, rgba(0,0,0,0.16), rgba(0,0,0,0) 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.16));
    pointer-events: none;
    z-index: 5;
  }
  .cb-spread::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 10%;
    bottom: 10%;
    width: 2px;
    margin-left: -1px;
    background: rgba(230,198,92,0.45);
    box-shadow: 0 0 12px rgba(230,198,92,0.5);
    pointer-events: none;
    z-index: 6;
    animation: cbSpineGlow 3.8s ease-in-out infinite;
  }
  @keyframes cbSpineGlow {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.9; }
  }

  .cb-page {
    padding: 30px 28px;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .cb-page-left { border-right: none; }
  .cb-page-right {
    background: var(--parchment-dark);
    transform-origin: left center;
    backface-visibility: hidden;
  }
  .cb-page-right.cb-flipping {
    animation: cbTurn 0.55s ease-in-out;
  }
  @keyframes cbTurn {
    0%   { transform: rotateY(0deg); }
    48%  { transform: rotateY(-92deg); }
    52%  { transform: rotateY(-92deg); }
    100% { transform: rotateY(0deg); }
  }

  .cb-page-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0.6;
    margin: 0 0 16px;
  }

  .cb-index-title {
    font-family: 'Cinzel Decorative', 'Cinzel', serif;
    font-size: 22px;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .cb-index-sub {
    font-style: italic;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 20px;
  }
  .cb-index-list { list-style: none; margin: 0; padding: 0; flex-grow: 1; }
  .cb-index-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px dotted rgba(42,32,21,0.25);
    cursor: pointer;
    font-size: 15px;
    transition: color 0.15s ease, padding-left 0.15s ease;
  }
  .cb-index-item:hover { color: #7a5a1a; padding-left: 4px; text-shadow: 0 0 10px rgba(230,198,92,0.4); }
  .cb-index-item .cb-index-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    opacity: 0.7;
  }

  .cb-recipe-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #7a5a1a;
    margin: 0 0 6px;
    opacity: 0.85;
  }
  .cb-recipe-title {
    font-family: 'Cormorant Garamond', 'EB Garamond', serif;
    font-weight: 600;
    font-size: 21px;
    margin: 0 0 4px;
    color: var(--ink);
    line-height: 1.25;
  }
  .cb-recipe-by {
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
    margin: 0 0 14px;
  }
  .cb-recipe-section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #7a5a1a;
    margin: 12px 0 6px;
  }
  .cb-recipe-list { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.6; }
  .cb-recipe-body { font-size: 14px; line-height: 1.6; margin: 0; }

  .cb-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    gap: 12px;
  }
  .cb-nav-btn {
    background: transparent;
    border: 1px solid rgba(201,162,39,0.5);
    color: var(--parchment);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    padding: 8px 16px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .cb-nav-btn:hover { background: rgba(201,162,39,0.12); border-color: var(--gold-bright); }
  .cb-nav-btn:disabled { opacity: 0.3; cursor: default; }
  .cb-nav-btn:disabled:hover { background: transparent; border-color: rgba(201,162,39,0.5); }
  .cb-nav-center {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--parchment-dim);
    text-align: center;
    flex-grow: 1;
  }

  .cb-close-row {
    text-align: center;
    margin-top: 14px;
  }
  .cb-close-btn {
    background: none;
    border: none;
    color: var(--parchment-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 4px 8px;
    transition: color 0.15s ease, text-shadow 0.15s ease;
  }
  .cb-close-btn:hover { color: var(--gold-bright); text-shadow: 0 0 10px rgba(230,198,92,0.4); }

  .cb-book.cb-closing {
    animation: cbBookClose 0.5s ease forwards;
  }
  @keyframes cbBookClose {
    from { opacity: 1; transform: rotateY(0deg); }
    to { opacity: 0; transform: rotateY(90deg) translateX(30px); }
  }

  @media (max-width: 640px) {
    .cb-spread { grid-template-columns: 1fr; }
    .cb-spread::before { display: none; }
    .cb-page-left { display: none; }
    .cb-page { padding: 22px 20px; }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600&family=Cormorant+Garamond:wght@600&family=EB+Garamond:ital,wght@0,400;1,400&family=IM+Fell+English+SC&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<script>
(function () {

  /* =========================================================
     COVER SETTINGS — edit the title/subtitle here, and paste a
     logo image URL if you have one (upload it to your Wix Media
     Manager, click it, choose "Copy Image URL", paste below).
     Leave LOGO_URL empty to keep the glowing crescent-moon sigil.
  ========================================================= */
  const BOOK_TITLE = "The Obsidian Moon Cookbook";
  const BOOK_SUBTITLE = "Potions, spells, remedies, curses, and recipes, gathered by the Coven itself.";

  /* =========================================================
     LIVE DATA — pulls real, approved entries from your Wix site.
     If this ever needs to point somewhere else, this is the only
     line to change.
  ========================================================= */

  function splitList(text) {
    if (!text) return [];
    return String(text).split(/\r?\n|,\s*/).map(function (s) { return s.trim(); }).filter(Boolean);
  }

  let ENTRIES = [];
  let dataReady = false;
  let dataFailed = false;

  const dataPromise = fetch(DATA_ENDPOINT)
    .then(function (res) { return res.json(); })

        return {
          category: e.category || "Recipes",
          title: e.title || "Untitled",
          by: e.submittedBy || "a Coven member",
          ingredients: splitList(e.ingredients),
          steps: e.instructions || ""
        };
      });
      dataReady = true;
    })

  const CATEGORIES = ["Potions", "Spells", "Remedies", "Curses", "Recipes"];

  const root = document.getElementById("cookbook-root");

  const eyebrow = document.createElement("p");
  eyebrow.className = "cb-eyebrow";
  eyebrow.textContent = "Obsidian Moon Temple — Preview";
  root.appendChild(eyebrow);

  const stage = document.createElement("div");
  stage.className = "cb-stage";
  root.appendChild(stage);

  const cover = document.createElement("div");
  cover.className = "cb-cover";
  const logoHtml = LOGO_URL
    ? '<img class="cb-cover-logo" src="' + LOGO_URL + '" alt="' + BOOK_TITLE + ' logo">'
    : '<div class="cb-cover-sigil">&#9770;</div>';
  cover.innerHTML =
    logoHtml +
    '<h2 class="cb-cover-title">' + BOOK_TITLE + '</h2>' +
    '<p class="cb-cover-sub">' + BOOK_SUBTITLE + '</p>' +
    '<p class="cb-cover-prompt">Click to open the book</p>';
  stage.appendChild(cover);

  const book = document.createElement("div");
  book.className = "cb-book";
  book.innerHTML =
    '<div class="cb-spread">' +
      '<div class="cb-page cb-page-left" id="cb-left"></div>' +
      '<div class="cb-page cb-page-right" id="cb-right"></div>' +
    '</div>' +
    '<div class="cb-nav">' +
      '<button type="button" class="cb-nav-btn" id="cb-prev">&#8249; Prev</button>' +
      '<span class="cb-nav-center" id="cb-nav-label"></span>' +
      '<button type="button" class="cb-nav-btn" id="cb-next">Next &#8250;</button>' +
    '</div>' +
    '<div class="cb-close-row"><button type="button" class="cb-close-btn" id="cb-close">Close the book</button></div>';
  stage.appendChild(book);

  const leftPage = book.querySelector("#cb-left");
  const rightPage = book.querySelector("#cb-right");
  const prevBtn = book.querySelector("#cb-prev");
  const nextBtn = book.querySelector("#cb-next");
  const navLabel = book.querySelector("#cb-nav-label");

  let view = { mode: "index" };
  let history = [];

  function categoryEntries(cat) {
    return ENTRIES.filter(function (e) { return e.category === cat; });
  }

  function renderIndexLeft() {
    leftPage.innerHTML =
      '<p class="cb-page-label">Table of Contents</p>' +
      '<h3 class="cb-index-title">Index of the Coven</h3>' +
      '<p class="cb-index-sub">Choose a chapter to browse its entries.</p>';
  }

  function renderCategoryList() {
    const list = document.createElement("ul");
    list.className = "cb-index-list";
    CATEGORIES.forEach(function (cat) {
      const li = document.createElement("li");
      li.className = "cb-index-item";
      li.innerHTML = '<span>' + cat + '</span><span class="cb-index-count">' + categoryEntries(cat).length + ' entries</span>';
      li.addEventListener("click", function () { goTo({ mode: "category", category: cat, index: 0 }); });
      list.appendChild(li);
    });
    return list;
  }

  function renderRightIndex() {
    rightPage.innerHTML = '<p class="cb-page-label">Chapters</p>';
    rightPage.appendChild(renderCategoryList());
  }

  function renderRecipe(entry) {
    rightPage.innerHTML =
      '<p class="cb-recipe-badge">' + entry.category + '</p>' +
      '<h3 class="cb-recipe-title">' + entry.title + '</h3>' +
      '<p class="cb-recipe-by">Submitted by ' + entry.by + '</p>' +
      '<p class="cb-recipe-section-label">Gather</p>' +
      '<ul class="cb-recipe-list">' + entry.ingredients.map(function (i) { return '<li>' + i + '</li>'; }).join("") + '</ul>' +
      '<p class="cb-recipe-section-label">Working</p>' +
      '<p class="cb-recipe-body">' + entry.steps + '</p>';
  }

  function renderCategoryLeft(cat) {
    const others = CATEGORIES.filter(function (c) { return c !== cat; });
    leftPage.innerHTML = '<p class="cb-page-label">' + cat + '</p><h3 class="cb-index-title">' + cat + '</h3>';
    const list = document.createElement("ul");
    list.className = "cb-index-list";
    others.forEach(function (c) {
      const li = document.createElement("li");
      li.className = "cb-index-item";
      li.innerHTML = '<span>' + c + '</span><span class="cb-index-count">' + categoryEntries(c).length + '</span>';
      li.addEventListener("click", function () { goTo({ mode: "category", category: c, index: 0 }); });
      list.appendChild(li);
    });
    leftPage.appendChild(list);
  }

  function render(withFlip) {
    function paint() {
      if (view.mode === "index") {
        renderIndexLeft();
        renderRightIndex();
        navLabel.textContent = "Table of Contents";
        prevBtn.disabled = true;
        nextBtn.disabled = false;
        nextBtn.textContent = "Begin \u203A";
      } else {
        const entries = categoryEntries(view.category);
        renderCategoryLeft(view.category);
        if (entries.length === 0) {
          rightPage.innerHTML =
            '<p class="cb-recipe-badge">' + view.category + '</p>' +
            '<h3 class="cb-recipe-title">This chapter awaits its first entry</h3>' +
            '<p class="cb-recipe-body">No approved recipes here yet. Be the first of the Coven to add one.</p>';
          navLabel.textContent = view.category + " \u2014 0 entries";
        } else {
          renderRecipe(entries[view.index]);
          navLabel.textContent = view.category + " \u2014 " + (view.index + 1) + " / " + entries.length;
        }
        prevBtn.disabled = false;
        nextBtn.disabled = false;
        nextBtn.textContent = (entries.length === 0 || view.index === entries.length - 1) ? "Next chapter \u203A" : "Next \u203A";
      }
    }
    if (withFlip) {
      rightPage.classList.add("cb-flipping");
      setTimeout(paint, 260);
      setTimeout(function () { rightPage.classList.remove("cb-flipping"); }, 550);
    } else {
      paint();
    }
  }

  function goTo(next) {
    history.push(view);
    view = next;
    render(true);
  }

  prevBtn.addEventListener("click", function () {
    if (view.mode === "category") {
      if (view.index > 0) {
        goTo({ mode: "category", category: view.category, index: view.index - 1 });
      } else {
        goTo({ mode: "index" });
      }
    }
  });

  nextBtn.addEventListener("click", function () {
    if (view.mode === "index") {
      goTo({ mode: "category", category: CATEGORIES[0], index: 0 });
      return;
    }
    const entries = categoryEntries(view.category);
    if (view.index < entries.length - 1) {
      goTo({ mode: "category", category: view.category, index: view.index + 1 });
    } else {
      const catIdx = CATEGORIES.indexOf(view.category);
      if (catIdx < CATEGORIES.length - 1) {
        goTo({ mode: "category", category: CATEGORIES[catIdx + 1], index: 0 });
      } else {
        goTo({ mode: "index" });
      }
    }
  });

  const closeBtn = book.querySelector("#cb-close");

  cover.addEventListener("click", function () {
    cover.classList.add("cb-opening");
    setTimeout(function () {
      book.classList.add("cb-visible");
      if (dataReady) {
        render(false);
      } else {
        leftPage.innerHTML = '<p class="cb-page-label">Table of Contents</p><h3 class="cb-index-title">Consulting the archive\u2026</h3>';
        rightPage.innerHTML = '<p class="cb-recipe-body">Gathering the Coven\'s latest entries.</p>';
        navLabel.textContent = "";
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        dataPromise.then(function () { render(false); });
      }
    }, 380);
  });

  closeBtn.addEventListener("click", function () {
    book.classList.add("cb-closing");
    setTimeout(function () {
      book.classList.remove("cb-visible", "cb-closing");
      view = { mode: "index" };
      history = [];
      cover.classList.remove("cb-opening");
    }, 480);
  });

})();
</script>

</body></html>
