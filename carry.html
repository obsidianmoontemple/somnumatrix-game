<meta charset="utf-8">

<title>Bringing your things over</title>

<style>
html,body{margin:0;background:#0d0b16;color:#ece6f7;font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:30rem;margin:12vh auto;padding:1.5rem;background:#1a1628;border-radius:14px}
a{color:#d8b45a}
</style>

<body>
<main>
  <p id="say">Bringing your things over…</p>
</main>
<script>
(function () {
"use strict";
var OLD_ORIGIN = "https://obsidianmoontemple.github.io", OLD_DIR = "/dreamscape/";
var DBS = ["sm-memory-book", "somnu-home-media"];
var base = new URL(".", location.href).href;
function say(t) { document.getElementById("say").textContent = t; }
function safeTo(to) {
try {
var u = new URL(to || "", base);
if (u.origin === location.origin)
return u.href;
}
catch (e) { }
return base;
}
function failed() {
var p = document.getElementById("say");
p.innerHTML = "Something stopped the move. Your things are still safe at the old address. ";
var a = document.createElement("a");
a.href = OLD_ORIGIN + OLD_DIR + "#carry-again";
a.textContent = "Try again";
p.appendChild(a);
}
if (location.origin === OLD_ORIGIN)
return;
function keepLs(o) {
if (!o || typeof o !== "object")
return;
Object.keys(o).forEach(function (k) {
if (typeof o[k] !== "string")
return;
try {
if (localStorage.getItem(k) === null)
localStorage.setItem(k, o[k]);
}
catch (e) { }
});
}
function keepDb(d) {
return new Promise(function (res) {
if (!d || DBS.indexOf(d.name) < 0 || !Array.isArray(d.stores) || !window.indexedDB)
return res();
var r;
try {
r = indexedDB.open(d.name, Math.max(1, d.version | 0));
}
catch (e) {
return res();
}
r.onupgradeneeded = function () {
var db = r.result;
d.stores.forEach(function (s) {
if (!db.objectStoreNames.contains(s.name)) {
var opt = { autoIncrement: !!s.autoIncrement };
if (s.keyPath != null)
opt.keyPath = s.keyPath;
db.createObjectStore(s.name, opt);
}
});
};
r.onerror = function (e) { if (e && e.preventDefault)
e.preventDefault(); res(); };
r.onsuccess = function () {
var db = r.result, have = d.stores.filter(function (s) { return db.objectStoreNames.contains(s.name); });
if (!have.length) {
db.close();
return res();
}
var tx = db.transaction(have.map(function (s) { return s.name; }), "readwrite");
have.forEach(function (s) {
var st = tx.objectStore(s.name);
(s.records || []).forEach(function (kv) {
try {
var q = st.keyPath != null ? st.add(kv[1]) : st.add(kv[1], kv[0]);
q.onerror = function (e) { e.preventDefault(); e.stopPropagation(); };
}
catch (e) { }
});
});
tx.oncomplete = tx.onabort = tx.onerror = function () { db.close(); res(); };
};
});
}
function keep(data) {
keepLs(data && data.ls);
var dbs = Array.isArray(data && data.idb) ? data.idb : [];
return dbs.reduce(function (p, d) { return p.then(function () { return keepDb(d); }); }, Promise.resolve());
}
function gunzip(b64) {
var s = b64.replace(/-/g, "+").replace(/_/g, "/"), bin = atob(s), b = new Uint8Array(bin.length);
for (var i = 0; i < bin.length; i++)
b[i] = bin.charCodeAt(i);
return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
if (/[?&]by=tab\b/.test(location.search)) {
if (!window.opener)
return location.replace(base);
window.addEventListener("message", function (e) {
if (e.origin !== OLD_ORIGIN || !e.data || e.data.t !== "carry")
return;
keep(e.data.data).then(function () {
say("All moved.");
try {
e.source.postMessage({ t: "carry-done" }, OLD_ORIGIN);
}
catch (x) { }
setTimeout(function () { window.close(); location.replace(base); }, 400);
}).catch(failed);
});
window.opener.postMessage({ t: "carry-ready" }, OLD_ORIGIN);
return;
}
var h = new URLSearchParams(location.hash.slice(1)), to = safeTo(h.get("to")), d = h.get("d");
try {
history.replaceState(null, "", location.pathname);
}
catch (e) { }
var from = "";
try {
from = document.referrer ? new URL(document.referrer).origin : "";
}
catch (e) { }
if (!d || (from && from !== OLD_ORIGIN) || typeof DecompressionStream === "undefined")
return location.replace(to);
function carry() { gunzip(d).then(function (t) { return keep(JSON.parse(t)); }).then(function () { location.replace(to); }).catch(failed); }
if (from)
return carry();
say("Did you just come from SomnuMatrix's old address?");
var m = document.querySelector("main");
[["Yes, bring my things", carry], ["No", function () { location.replace(to); }]].forEach(function (b) {
var el = document.createElement("button");
el.textContent = b[0];
el.onclick = b[1];
el.style.cssText = "font:inherit;margin:.8rem .4rem 0 0;padding:.6rem 1rem;border-radius:10px;border:1px solid #d8b45a;background:#d8b45a;color:#1a1405";
m.appendChild(el);
});
})();
</script>
</body>
</html>
