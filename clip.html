<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'">
<meta name="theme-color" content="#07080B">
<link rel="icon" type="image/png" href="widow-192.png">
<title>A clip from SomnuMatrix</title>
<style>
/* clip.html: one short clip a player recorded in the game and shared (4 November 2026, gap list item 19).
   The link is clip.html?c=<their folder>/<file>; the clip itself lives in the public "clips" bucket. */
:root{--void:#07080B;--silk:#E6E9EF;--dim:#8A8F9C;--gold:#FFD27A;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--void);color:var(--silk);font-family:var(--sans)}
main{max-width:960px;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:14px}
h1{margin:0;font:500 22px/1.2 var(--serif);color:var(--gold);letter-spacing:.04em}
video{width:100%;max-height:72vh;background:#000;border-radius:6px;box-shadow:0 14px 50px rgba(0,0,0,.6)}
p{margin:0;color:var(--dim);text-align:center}
a.btn{display:inline-block;padding:10px 18px;border:1px solid var(--gold);border-radius:6px;color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<main>
  <h1>SomnuMatrix</h1>
  <video id="v" controls playsinline loop></video>
  <p id="say">A clip recorded in the world of SomnuMatrix.</p>
  <a class="btn" href="index.html">Step into the dream</a>
</main>
<script>
(function(){var e="https://ryxmrkwgdyphcdlglwka.supabase.co";var t=new URLSearchParams(location.search).get("c")||"",n=document.getElementById("v"),o=document.getElementById("say");if(!/^[0-9a-f-]{36}\/[A-Za-z0-9_-]{1,80}\.(webm|mp4)$/.test(t)){n.style.display="none";o.textContent="This link has no clip in it.";return}n.src=e+"/storage/v1/object/public/clips/"+t.split("/").map(encodeURIComponent).join("/");n.onerror=function(){n.style.display="none";o.textContent="This clip has been removed, or the link is not whole."}})();
</script>
</body>
</html>
