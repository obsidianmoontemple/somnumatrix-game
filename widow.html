<style>
/* widow.html: the White Widow on the Keeper's laptop. A small window he leaves
   open all day: she talks with him (typed, or held-to-talk / "Widow, ..."),
   reads his world as the Keeper (read-only, only when asked), and looks up
   what the world does not know on Wikipedia. Nothing runs between questions
   except a glance at the world every ten minutes while the window is showing. */
:root{
  --void:#07080B; --deep:#0E1118; --panel:#12151D; --silk:#E6E9EF; --bone:#C9BEA8; --dim:#7A7F8C;
  --moon:#9FB4D6; --ember:#C9845A; --line:rgba(230,233,239,0.12); --ok:#8FB59A;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:var(--silk);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.btn{background:transparent;border:1px solid var(--line);color:var(--dim);padding:7px 11px;border-radius:6px;cursor:pointer}
.btn:hover{color:var(--silk);border-color:var(--silk)}
.btn.primary{color:var(--silk);border-color:var(--moon)}
.btn.on{color:var(--void);background:var(--moon);border-color:var(--moon)}
.btn:disabled{opacity:.4;cursor:default}
input,textarea{background:var(--void);border:1px solid var(--line);border-radius:6px;padding:8px 10px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--moon)}
.note{font-size:12.5px;color:var(--dim);line-height:1.55}
h1{font-family:var(--serif);font-weight:400;font-size:20px;margin:0;letter-spacing:.03em}

#gate{min-height:100%;display:grid;place-items:center;padding:20px}
#gate .card{width:min(360px,100%)}
#gate label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px}
.mark{width:54px;height:54px;margin-bottom:10px}

#desk{height:100%;display:grid;grid-template-rows:auto 1fr auto auto auto}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
header .mark{width:28px;height:28px;margin:0}
header h1{flex:1;font-size:17px}
#dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
#dot.think{background:var(--moon);animation:pulse 1.2s ease-in-out infinite}
#dot.ear{background:var(--ember)}
@media (prefers-reduced-motion:reduce){#dot.think{animation:none}}
@keyframes pulse{50%{opacity:.35}}
#glance{display:flex;gap:6px;flex-wrap:wrap;padding:7px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
#glance span b{color:var(--silk);font-weight:500}
#log{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;max-height:24vh;border-top:1px solid var(--line)}
/* with the talk tucked away, only her offers (files, emails) and short notices still show under her face */
body.notalk #log .m.me,body.notalk #log .m.her,body.notalk #log .act.done{display:none}
body.notalk #log:not(:has(.act:not(.done),.m.sys)){display:none}
.m{max-width:88%;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.m.me{align-self:flex-end;background:var(--panel);border:1px solid var(--line);padding:7px 10px;border-radius:10px 10px 2px 10px}
.m.her{align-self:flex-start;font-family:var(--serif);font-size:15px;color:var(--silk)}
.m.her .src{display:block;font-family:var(--sans);font-size:11.5px;color:var(--dim);margin-top:4px}
.m.sys{align-self:center;font-size:12px;color:var(--dim);text-align:center}
footer{border-top:1px solid var(--line);padding:9px 10px;display:grid;gap:7px}
.row{display:flex;gap:6px;align-items:center}
#say{flex:1;resize:none;height:38px;max-height:120px}
#talk{min-width:44px;font-size:16px;padding:6px 10px;touch-action:none;user-select:none}
#talk.held{background:var(--ember);border-color:var(--ember);color:var(--void)}
.tools{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.tools .btn{padding:4px 8px;font-size:12px}
/* what she offers to do (save a file, send an email): nothing happens until he says so */
.act{align-self:stretch;border:1px solid var(--moon);border-radius:10px;padding:9px 11px;background:var(--panel);font-size:13px}
.act .k{font-size:11.5px;color:var(--moon);text-transform:uppercase;letter-spacing:.06em}
.act .h{margin:3px 0 6px;color:var(--silk)}
.act pre{margin:0 0 8px;max-height:180px;overflow:auto;white-space:pre-wrap;font:12.5px/1.5 var(--sans);color:var(--bone);border-top:1px solid var(--line);padding-top:6px}
.act .row{flex-wrap:wrap}
.act.done{border-color:var(--line);opacity:.7}
.m .at{font-family:var(--sans);font-size:10.5px;color:var(--dim);display:block;margin-bottom:2px}
/* her face: a woman of light. She blinks, glows while she thinks, and her lips move as she speaks */
/* her face is the window's heart: it takes all the room the talk does not need */
#presence{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px 14px;min-height:0;overflow:hidden}
#face{flex:1 1 auto;min-height:120px;width:100%;max-width:520px;border-radius:14px;background:transparent;filter:brightness(.88) drop-shadow(0 0 6px rgba(160,150,255,.14));transition:filter .6s}
#face.think{filter:brightness(.92) drop-shadow(0 0 14px rgba(170,150,255,.45))}
#face.talk{filter:brightness(.92) drop-shadow(0 0 10px rgba(200,210,255,.35))}
#caption{flex:none;width:100%;max-width:560px;text-align:center;font-family:var(--serif);font-size:16px;line-height:1.45;color:var(--silk);max-height:6.2em;overflow:auto}
#caption small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--dim);margin-bottom:3px}
#f-open{transform-origin:100px 122.6px;transform:scaleY(1);transition:transform .07s}
/* the TV: her face large and what she says in big letters, for casting to a television */
body.tv #desk{grid-template-rows:auto 1fr auto}
body.tv #glance,body.tv #log,body.tv header h1,body.tv #install{display:none}
body.tv #presence{flex-direction:column;justify-content:center;border:0;padding:3vh 6vw;gap:3vh}
body.tv #face{width:auto;max-width:none;height:58vh;flex:none;border-radius:2vh}
body.tv #caption{max-height:none;font-size:clamp(18px,3.4vw,52px);text-align:center;max-width:80vw}
body.tv #caption small{font-size:clamp(12px,1.6vw,24px);margin-bottom:1vh}
body.tv footer{opacity:.35;transition:opacity .3s}
body.tv footer:hover,body.tv footer:focus-within{opacity:1}
</style>
