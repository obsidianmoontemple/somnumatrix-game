<title>White Widow</title>
<style>
/* widow.html: the White Widow on the Keeper's laptop. A small window he leaves
   open all day: she talks with him (typed, or held-to-talk / "Widow, ..."),
   reads his world as the Keeper (read-only, only when asked), and looks up
   what the world does not know on Wikipedia. Nothing runs between questions
   except a glance at the world every ten minutes while the window is showing. */
:root{
  --void:#07080B; --deep:#0E1118; --panel:#12151D; --silk:#E6E9EF; --bone:#C9BEA8; --dim:#7A7F8C;
  --moon:#9FB4D6; --ember:#C9845A; --line:rgba(230,233,239,0.12); --ok:#8FB59A;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:var(--silk);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.btn{background:transparent;border:1px solid var(--line);color:var(--dim);padding:7px 11px;border-radius:6px;cursor:pointer}
.btn:hover{color:var(--silk);border-color:var(--silk)}
.btn.primary{color:var(--silk);border-color:var(--moon)}
.btn.on{color:var(--void);background:var(--moon);border-color:var(--moon)}
.btn:disabled{opacity:.4;cursor:default}
input,textarea{background:var(--void);border:1px solid var(--line);border-radius:6px;padding:8px 10px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--moon)}
.note{font-size:12.5px;color:var(--dim);line-height:1.55}
h1{font-family:var(--serif);font-weight:400;font-size:20px;margin:0;letter-spacing:.03em}

#gate{min-height:100%;display:grid;place-items:center;padding:20px}
#gate .card{width:min(360px,100%)}
#gate label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px}
.mark{width:54px;height:54px;margin-bottom:10px}

#desk{height:100%;display:grid;grid-template-rows:auto auto 1fr auto}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
header .mark{width:28px;height:28px;margin:0}
header h1{flex:1;font-size:17px}
#dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
#dot.think{background:var(--moon);animation:pulse 1.2s ease-in-out infinite}
#dot.ear{background:var(--ember)}
@media (prefers-reduced-motion:reduce){#dot.think{animation:none}}
@keyframes pulse{50%{opacity:.35}}
#glance{display:flex;gap:6px;flex-wrap:wrap;padding:7px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
#glance span b{color:var(--silk);font-weight:500}
#log{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.m.me{align-self:flex-end;background:var(--panel);border:1px solid var(--line);padding:7px 10px;border-radius:10px 10px 2px 10px}
.m.her{align-self:flex-start;font-family:var(--serif);font-size:15px;color:var(--silk)}
.m.her .src{display:block;font-family:var(--sans);font-size:11.5px;color:var(--dim);margin-top:4px}
.m.sys{align-self:center;font-size:12px;color:var(--dim);text-align:center}
footer{border-top:1px solid var(--line);padding:9px 10px;display:grid;gap:7px}
.row{display:flex;gap:6px;align-items:center}
#say{flex:1;resize:none;height:38px;max-height:120px}
#talk{min-width:44px;font-size:16px;padding:6px 10px;touch-action:none;user-select:none}
#talk.held{background:var(--ember);border-color:var(--ember);color:var(--void)}
.tools{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.tools .btn{padding:4px 8px;font-size:12px}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="wmark" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#07080B"/>
<g fill="none" stroke="#E6E9EF" stroke-width="1.4" opacity=".55"><circle cx="32" cy="32" r="9"/><circle cx="32" cy="32" r="17"/><circle cx="32" cy="32" r="25"/>
<path d="M32 4V60M4 32H60M12 12L52 52M52 12L12 52"/></g>
<g fill="#E6E9EF"><ellipse cx="32" cy="35" rx="5.5" ry="7"/><circle cx="32" cy="25.5" r="3.6"/></g>
<g stroke="#E6E9EF" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M28 31L19 24L15 27M28 34L17 33L13 37M28 38L19 42L16 47M36 31L45 24L49 27M36 34L47 33L51 37M36 38L45 42L48 47"/></g>
</symbol></defs></svg>

<div id="gate">
  <div class="card">
    <svg class="mark"><use href="#wmark"/></svg>
    <h1>White Widow</h1>
    <p class="note" id="gate-note">Sign in as the Keeper, the same as the Keeper's Desk.</p>
    <div id="gate-form">
      <label for="g-email">Email</label><input id="g-email" type="email" autocomplete="username">
      <label for="g-pass">Password</label><input id="g-pass" type="password" autocomplete="current-password">
      <div style="margin-top:14px"><button class="btn primary" id="g-go" type="button">Sign in</button></div>
    </div>
    <div id="gate-mfa" class="hidden">
      <label for="mfa-code">The six-digit code from your authenticator</label>
      <input id="mfa-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
      <div style="margin-top:14px"><button class="btn primary" id="mfa-go" type="button">Confirm</button></div>
    </div>
  </div>
</div>

<div id="desk" class="hidden">
  <header>
    <svg class="mark"><use href="#wmark"/></svg>
    <h1>White Widow</h1>
    <span id="dot" title="Quiet"></span>
    <button class="btn hidden" id="install" type="button" title="Keep her as an app with her own small window">Install</button>
  </header>
  <div id="glance"><span>Looking over the city&hellip;</span></div>
  <div id="log" aria-live="polite"></div>
  <footer>
    <div class="row">
      <textarea id="say" placeholder="Ask her anything&hellip;" rows="1"></textarea>
      <button class="btn" id="talk" type="button" title="Hold to talk (or hold the Space bar when the box is empty)">&#127908;</button>
      <button class="btn primary" id="send" type="button">Send</button>
    </div>
    <div class="tools">
      <button class="btn" id="t-wake" type="button" title="She listens for her name, then for what you say after it">Listen for &ldquo;Widow&rdquo;</button>
      <button class="btn" id="t-voice" type="button">Her voice: on</button>
      <button class="btn" id="t-look" type="button" title="Read the world again now">Look again</button>
      <button class="btn" id="t-forget" type="button" title="She forgets this conversation (her notes stay)">New talk</button>
      <button class="btn" id="t-out" type="button">Sign out</button>
    </div>
  </footer>
</div>
